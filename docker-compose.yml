services:
    postgres:
        image: postgres:17-alpine
        container_name: store_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: Password@1
            POSTGRES_DB: shop
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
            interval: 5s
            timeout: 5s
            retries: 10
volumes:
    pg_data:
