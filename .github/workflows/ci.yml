name: CI

# Vercel's Git integration handles deployment on push; this workflow is the
# quality gate only, so nothing here needs deploy credentials.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Always runs, on every push and PR. Needs no secrets, so a fork or a clone
  # with no Vercel credentials still gets a green build.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        run: dotnet build WebApiStore/WebApiStore.sln --configuration Release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: websitestorereact/package-lock.json

      - name: Install client dependencies
        working-directory: websitestorereact
        run: npm ci

      - name: Typecheck client
        working-directory: websitestorereact
        run: npx tsc -b

      - name: Lint client
        working-directory: websitestorereact
        run: npx eslint src

      - name: Build the deployment image
        run: docker build -f Dockerfile.vercel -t restore:ci .
